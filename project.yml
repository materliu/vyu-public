name: VYu
options:
  bundleIdPrefix: app.vyu
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: $(VYU_DEVELOPMENT_TEAM)
configFiles:
  Debug: Config/Build.xcconfig
  Release: Config/Build.xcconfig
targets:
  VYu:
    type: application
    platform: iOS
    sources: [App]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: V语
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        VYuICloudEnabled: $(VYU_ICLOUD_ENABLED)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: 浏览你输入的局域网页面，并下载其中可保存的视频。
        NSUbiquitousContainers:
          iCloud.app.vyu.ios:
            NSUbiquitousContainerIsDocumentScopePublic: false
            NSUbiquitousContainerName: V语
            NSUbiquitousContainerSupportedFolderLevels: Any
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(VYU_BUNDLE_IDENTIFIER)
        CODE_SIGN_ENTITLEMENTS: $(VYU_SIGNING_ENTITLEMENTS)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "21"
  VYuTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies: [{target: VYu}]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  VYuUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies: [{target: VYu}]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  VYu:
    build:
      targets:
        VYu: all
    test:
      targets: [VYuTests, VYuUITests]
